name: ERP Next Preview Release
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/erp-next/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build API (tests deferred until v1.0)
        run: mvn -B -ntp -f backend/erp-next/pom.xml clean package -DskipTests
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:prod
      - name: Package preview
        run: |
          bash -n scripts/release-preview/deploy.sh scripts/erp-next-package-preview.sh
          python3 -m py_compile scripts/release-preview/preview-deploy.py
          bash scripts/erp-next-package-preview.sh release
      - name: Archive release
        run: |
          tar -C release -czf erp-next-preview-linux.tar.gz .
          sha256sum erp-next-preview-linux.tar.gz > erp-next-preview-linux.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: erp-next-preview
          path: |
            erp-next-preview-linux.tar.gz
            erp-next-preview-linux.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request' && github.repository == 'nekox41/zjerp' && (github.ref == 'refs/heads/feat/erp-complete-service-workflow' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: erp-next-preview
      - name: Publish preview build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c erp-next-preview-linux.tar.gz.sha256
          tag="preview-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "ERP Next preview ${GITHUB_SHA:0:12}" --notes "Development preview only. Disposable local installation, no production migration. Commit: $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" erp-next-preview-linux.tar.gz erp-next-preview-linux.tar.gz.sha256

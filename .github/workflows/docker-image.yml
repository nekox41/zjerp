name: Monorepo Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven reactor verification
        run: mvn -B clean verify
      - name: Verify legacy file storage
        run: bash scripts/verify-file-storage.sh
  backend-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/erp-next/pom.xml
      - name: Build and test new ERP API
        run: mvn -B -f backend/erp-next/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build:prod
  docker:
    runs-on: ubuntu-latest
    needs: [backend-legacy, backend-next, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate legacy Compose without production credentials
        env:
          MYSQL_PASSWORD: ci-only
          MYSQL_ROOT_PASSWORD: ci-only
          REDIS_PASSWORD: ci-only
          TOKEN_SECRET: ci-only
        run: docker compose -f backend/compose.yml config --quiet
      - name: Validate new ERP Compose without production credentials
        env:
          ERP_NEXT_DB_PASSWORD: ci-only
          ERP_NEXT_DB_ROOT_PASSWORD: ci-only
          ERP_BOOTSTRAP_TOKEN: ci-only-bootstrap-token
        run: docker compose -f erp-next/compose.yaml config --quiet
      - name: Build new ERP API image
        run: docker build -f backend/erp-next/Dockerfile backend/erp-next

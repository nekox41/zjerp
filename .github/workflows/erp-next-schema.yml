name: ERP Next Schema and Smoke Test
on:
  push:
    paths:
      - 'erp-next/**'
      - 'backend/erp-next/**'
      - 'frontend/**'
      - '.github/workflows/erp-next-schema.yml'
  pull_request:
    paths:
      - 'erp-next/**'
      - 'backend/erp-next/**'
      - 'frontend/**'
      - '.github/workflows/erp-next-schema.yml'
concurrency:
  group: erp-next-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  schema-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ERP_NEXT_DB_ROOT_PASSWORD: ci_ephemeral_root_only
      ERP_NEXT_DB_PASSWORD: ci_ephemeral_user_only
      ERP_BOOTSTRAP_TOKEN: ci-only-bootstrap-token
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Compose configuration
        run: docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml config --quiet
      - name: Start isolated MySQL
        run: docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml up -d erp-next-mysql
      - name: Apply schema V1 and V2
        run: timeout 180 docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml run --rm erp-next-schema
      - name: Re-run migrations idempotently
        run: timeout 180 docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml run --rm erp-next-schema
      - name: Verify schema history and tables
        run: |
          docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml exec -T -e MYSQL_PWD="$ERP_NEXT_DB_PASSWORD" erp-next-mysql \
            mysql -u erp_next -D erp_next -N -e \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE version IN ('1','2') AND success = 1" | grep -qx 2
          docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml exec -T -e MYSQL_PWD="$ERP_NEXT_DB_PASSWORD" erp-next-mysql \
            mysql -u erp_next -D erp_next -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'erp_next' AND table_name LIKE 'erp_%'" | grep -qx 11
      - name: Build and start API and web
        run: docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml up -d --build
      - name: Collect container diagnostics
        if: always()
        run: |
          docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml ps -a
          docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml logs --no-color --tail=200 erp-next-api erp-next-schema erp-next-web || true
      - name: Verify API, web and administrator bootstrap
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8090/actuator/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8090/actuator/health
          curl -fsS http://127.0.0.1:8089/next.html | grep -q 'next-app'
          curl -fsS http://127.0.0.1:8089/next-api/bootstrap/status | grep -q '"initialized":false'
          curl -fsS -X POST http://127.0.0.1:8089/next-api/bootstrap/admin \
            -H 'Content-Type: application/json' -H "X-Bootstrap-Token: $ERP_BOOTSTRAP_TOKEN" \
            -d '{"username":"admin","displayName":"CI Admin","password":"ci-only-password-123"}' >/dev/null
          LOGIN=$(curl -fsS -X POST http://127.0.0.1:8089/next-api/auth/login \
            -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-only-password-123"}')
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$LOGIN")
          test -n "$TOKEN"
          curl -fsS http://127.0.0.1:8089/next-api/auth/me -H "Authorization: Bearer $TOKEN" | grep -q 'CI Admin'
      - name: Stop isolated stack and remove CI-only volume
        if: always()
        run: docker compose --env-file erp-next/.env.example -f erp-next/compose.yaml down -v --remove-orphans

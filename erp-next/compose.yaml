# Standalone, isolated next-generation ERP schema sandbox.
# Requires ERP_NEXT_DB_ROOT_PASSWORD and ERP_NEXT_DB_PASSWORD in environment.
# No host MySQL port is published and no legacy database is mounted.
services:
  erp-next-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_NEXT_DB_ROOT_PASSWORD:?Set ERP_NEXT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: erp_next
      MYSQL_USER: erp_next
      MYSQL_PASSWORD: ${ERP_NEXT_DB_PASSWORD:?Set ERP_NEXT_DB_PASSWORD}
    volumes:
      - erp_next_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [erp-next-internal]
    restart: unless-stopped

  erp-next-schema:
    image: flyway/flyway:10.20.1
    depends_on:
      erp-next-mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://erp-next-mysql:3306/erp_next
      FLYWAY_USER: erp_next
      FLYWAY_PASSWORD: ${ERP_NEXT_DB_PASSWORD:?Set ERP_NEXT_DB_PASSWORD}
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    volumes:
      - ./db/migration:/flyway/sql:ro
    command: ["migrate"]
    networks: [erp-next-internal]
    restart: "no"

volumes:
  erp_next_mysql_data:
    name: erp_next_mysql_data

networks:
  erp-next-internal:
    internal: true

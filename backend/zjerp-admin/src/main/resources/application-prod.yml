# Production credentials and service endpoints must be supplied by the deployment environment.
# Compose maps these properties from its private .env file. Missing required values fail startup.
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: ${SPRING_DATASOURCE_DRUID_MASTER_URL}
        username: ${SPRING_DATASOURCE_DRUID_MASTER_USERNAME}
        password: ${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD}
      slave:
        enabled: false
        url: ${SPRING_DATASOURCE_DRUID_SLAVE_URL:}
        username: ${SPRING_DATASOURCE_DRUID_SLAVE_USERNAME:}
        password: ${SPRING_DATASOURCE_DRUID_SLAVE_PASSWORD:}
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      # Keep the Druid monitoring console disabled in production.
      webStatFilter:
        enabled: false
      statViewServlet:
        enabled: false
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

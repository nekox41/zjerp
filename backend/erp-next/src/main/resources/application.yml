server:
  port: ${ERP_NEXT_PORT:8090}
spring:
  application:
    name: erp-next-api
  datasource:
    url: ${ERP_NEXT_DB_URL:jdbc:mysql://localhost:3306/erp_next?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${ERP_NEXT_DB_USER:erp_next}
    password: ${ERP_NEXT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
erp:
  bootstrap:
    token: ${ERP_BOOTSTRAP_TOKEN:}
  auth:
    session-hours: 12
    max-failed-logins: 5
    lock-minutes: 10

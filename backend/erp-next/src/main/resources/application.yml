server:
  port: ${ERP_NEXT_PORT:8090}
spring:
  application:
    name: erp-next-api
  datasource:
    url: ${ERP_NEXT_DB_URL:jdbc:postgresql://localhost:5432/erp_next?stringtype=unspecified}
    username: ${ERP_NEXT_DB_USER:erp_next}
    password: ${ERP_NEXT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 250MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
erp:
  bootstrap:
    token: ${ERP_BOOTSTRAP_TOKEN:}
    local-test: ${ERP_LOCAL_TEST_BOOTSTRAP:false}
  files:
    root: ${ERP_FILES_ROOT:/var/lib/erp-next/files}
  auth:
    session-hours: 12
    max-failed-logins: 5
    lock-minutes: 10
